<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Comparison Study</title>
<style>
  :root {
    color-scheme: light;
    --clip-native: 1534px;                /* 0.6x the source video width */
    /* The 62vw cap matters on narrow windows: without it `width: 100%` would stretch a clip
       to nearly the full screen, silently overriding the intended scale. */
    --clip-width: min(var(--clip-native), 62vw);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: #1a1c1e;
    line-height: 1.55;
  }
  header { background: #fff; border-bottom: 1px solid #e2e4e8; padding: 30px 24px 26px; }
  /* Same width as the clip column so the header text lines up with the cards.
     Body copy stays narrower via .lead's own max-width, for readability. */
  .wrap { max-width: calc(var(--clip-width) + 48px); margin: 0 auto; }
  h1 { margin: 0 0 10px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .lead { margin: 0 0 16px; max-width: 860px; color: #4b5058; font-size: 14.5px; }
  .lead ol { margin: 8px 0 0; padding-left: 20px; }
  .lead li { margin: 3px 0; }
  .cta {
    display: inline-block; padding: 9px 16px; border-radius: 7px;
    background: #3b5bdb; color: #fff; font-size: 14px; font-weight: 600;
    text-decoration: none;
  }
  .cta:hover { background: #31499f; }
  .cta-todo { background: #dfe2e7; color: #6b7280; cursor: default; }
  /* One clip per row: each one is a 2x3 grid of panels, so it needs the full width
     to stay legible. --clip-width keeps the row at the intended share of native size. */
  .grid {
    max-width: calc(var(--clip-width) + 48px); margin: 26px auto 80px; padding: 0 24px;
    display: grid; grid-template-columns: 1fr; gap: 30px;
  }
  .card { margin: 0; background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; overflow: hidden; }
  .card-head { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #eef0f2; }
  .badge {
    flex: none; padding: 2px 7px; border-radius: 4px;
    background: #3b5bdb; color: #fff; font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .title { font-size: 15px; font-weight: 600; }
  video { display: block; width: 100%; height: auto; background: #000; }
  @media (max-width: 620px) { .grid { padding: 0 12px; gap: 18px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Motion Comparison Study</h1>
    <p class="lead">
      总共10个视频，请一边查看视频，一边填写问卷。视频有声音，听请佩戴耳机或者音响。
    </p>
    <div class="lead">
      每一个视频都是2行3列的网格。
      <ol>
        <li><b>左上的绿色人体的真实数据，仅供参考，不参与评价。</li>
        <li><b>其余5个黄色人体是5个不同的方法生成的结果，带有1-5的编号。</li>
      </ol>
      蓝色球体代表动态声源的位置.
    </div>
  </div>
</header>
<main class="grid">
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 01</span>
          <span class="title">机关枪声，可想象为一个枪手>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260324_gun_machine_01_curve_down_no_collision_insensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 02</span>
          <span class="title">狗叫声</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260410_bark_03_straight_left_collision_insensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 03</span>
          <span class="title">地上的鞭炮声</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260422_firework_02_straight_left_walk_no_collision_sensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 04</span>
          <span class="title">一个吉他手在弹吉他</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260422_guitar_c_04_curve_right_stand_no_collision_sensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 05</span>
          <span class="title">一群黄蜂在飞</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260422_insect_bees_03_curve_up_stand_no_collision_insensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 06</span>
          <span class="title">小猫叫声</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260427_cat_07_curve_right_walk_collision_sensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 07</span>
          <span class="title">天上直升飞机在飞</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260427_helicopter_c_01_curve_left_stand_no_collision_sensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 08</span>
          <span class="title">一片云正在下暴雨</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260427_rainstorm_03_curve_up_walk_collision_sensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 09</span>
          <span class="title">汽车缓慢通过，带有巨大的尾气声</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260517_car_slow_c_04_curve_left_stand_no_collision_sensitive.mp4"></video>
      </figure>
      <figure class="card">
        <figcaption class="card-head">
          <span class="badge">Video 10</span>
          <span class="title">一个人一边打喷嚏一边走过</span>
        </figcaption>
        <video controls preload="metadata" playsinline src="videos/20260517_sneezing_03_curve_right_walk_collision_insensitive.mp4"></video>
      </figure>
</main>
<script>
  // Keep a single clip playing at a time, so overlapping audio cannot confuse a rating.
  const players = Array.from(document.querySelectorAll('video'));
  players.forEach(v => v.addEventListener('play', () => {
    players.forEach(other => { if (other !== v && !other.paused) other.pause(); });
  }));
</script>
</body>
</html>
